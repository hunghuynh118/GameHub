<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celestials Game Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
<link rel="stylesheet" href="/hub.css">
<link rel="stylesheet" href="/shop.css">
<link rel="stylesheet" href="/xmas.css">
<script>if(localStorage.getItem('hub_xmas_v3')!=='0')document.documentElement.dataset.theme='xmas';</script>
</head>
<body>
<div class="hub-ambient" aria-hidden="true">
  <div class="ambient-glow g1"></div>
  <div class="ambient-glow g2"></div>
  <div class="ambient-glow g3"></div>
  <svg class="botanical b-tl" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M18 8C48 56 84 106 142 152" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M44 46C74 28 102 36 106 60C80 72 56 66 44 46Z" fill="currentColor" opacity=".45"/>
    <path d="M76 86C52 96 42 122 58 140C84 134 94 108 76 86Z" fill="currentColor" opacity=".35"/>
    <path d="M100 110C130 92 158 102 162 126C136 138 112 130 100 110Z" fill="currentColor" opacity=".3"/>
    <path d="M22 24C6 44 10 68 32 76C48 58 44 34 22 24Z" fill="currentColor" opacity=".32"/>
    <circle cx="152" cy="160" r="3" fill="currentColor" opacity=".4"/>
    <circle cx="164" cy="169" r="2" fill="currentColor" opacity=".3"/>
  </svg>
  <svg class="botanical b-br" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M224 232C186 176 146 128 84 78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M192 186C160 202 132 192 128 168C156 156 180 164 192 186Z" fill="currentColor" opacity=".42"/>
    <path d="M158 144C184 134 196 108 180 88C154 94 142 120 158 144Z" fill="currentColor" opacity=".34"/>
    <path d="M126 114C96 128 70 118 66 94C92 84 116 94 126 114Z" fill="currentColor" opacity=".28"/>
    <path d="M208 212C226 194 224 168 202 160C186 176 188 202 208 212Z" fill="currentColor" opacity=".3"/>
    <circle cx="72" cy="68" r="3" fill="currentColor" opacity=".35"/>
  </svg>
</div>
<!-- ============ MÀN HÌNH CHÍNH ============ -->
<section id="scr-home" class="screen">
  <div class="home card">
    <div class="home-top">
      <button id="btn-whatsnew" class="ghost home-pill" type="button" title="Xem các tính năng và cập nhật mới">✨ What's new</button>
      <span class="grow"></span>
    </div>
    <div class="logo-wrap"><div class="logo">🪐</div></div>
    <h1 class="title">CELESTIALS</h1>
    <div class="subtitle">Đấu trí, lật kèo và bùng nổ cùng hội bạn!</div>
    <div id="showcase" class="showcase"></div>
    <div id="acct" class="acct hidden"></div>
    <label id="lab-name">Tên hiển thị <input id="in-name" maxlength="16" placeholder="Nhập tên hiển thị..." autocomplete="off"></label>
    <button id="btn-create" class="gold big">Tạo phòng mới</button>
    <div class="or"><span>Hoặc tham gia phòng có sẵn</span></div>
    <div class="row"><input id="in-code" maxlength="4" placeholder="MÃ PHÒNG" autocomplete="off"><button id="btn-join">Tham gia</button></div>
    <div class="home-foot"><a class="small rank-link" href="/report" target="_blank">🏆 Bảng xếp hạng</a></div>
  </div>
</section>

<!-- ============ PHÒNG CHỜ ============ -->
<section id="scr-room" class="screen hidden">
  <div class="room card">
    <div class="room-top">
      <span>Phòng</span><span id="room-code" class="code"></span>
      <span class="grow"></span>
      <button id="btn-shop" class="gold lk-shopbtn hidden">🛍️</button>
      <button id="btn-ach" class="ghost hidden" title="Thành tựu & Danh hiệu">🎖️</button>
      <button id="btn-rank" class="ghost" title="Bảng xếp hạng (mở tab mới)">🏆</button>
      <button id="btn-copy" class="ghost">Sao chép liên kết</button>
      <button id="btn-leave" class="ghost">Rời phòng</button>
    </div>
    <div id="room-links" class="links small muted"></div>
    <div class="section-title">Trò chơi hiện tại</div>
    <div id="game-cur" class="gcur"></div>
    <div class="section-title">Vị trí chỗ ngồi</div>
    <div id="seats" class="seats"></div>
    <div id="room-opts" class="opts"></div>
    <div id="room-members" class="small muted"></div>
    <div class="room-actions">
      <span id="room-wait" class="muted grow"></span>
      <button id="btn-unsit" class="ghost">Rời ghế</button>
      <button id="btn-bots" class="ghost">Thêm bot vào ghế trống</button>
      <button id="btn-start" class="gold big">Bắt đầu ván đấu</button>
    </div>
  </div>
</section>

<!-- ============ GAME (game tự vẽ giao diện vào đây) ============ -->
<section id="scr-game" class="hidden"><div id="game-root"></div></section>
<section id="scr-loading" class="screen hidden"><div id="loading">Đang tải trò chơi...</div></section>

<!-- ============ CHAT + ĐÀM THOẠI (hiện khi đã vào phòng) ============ -->
<div id="chat" class="hidden">
  <div id="chat-peek"></div>
  <div id="chat-panel" class="card hidden">
    <div class="chat-head"><b>💬 Trò chuyện</b><span class="grow"></span><button id="chat-x" class="ghost" title="Đóng (Esc)">✕</button></div>
    <div id="voice-bar"></div>
    <div id="chat-log"></div>
    <form id="chat-form"><input id="chat-in" maxlength="200" placeholder="Nhập tin nhắn..." autocomplete="off"><button>Gửi</button></form>
  </div>
  <button id="voice-btn" class="ghost">🎙️</button>
  <button id="chat-btn" class="ghost" title="Trò chuyện (Enter)">💬<span id="chat-badge" class="hidden"></span></button>
</div>

<div id="voice-talk"></div>
<canvas id="fx"></canvas>
<div id="modal" class="hidden"></div>
<div id="toast"></div>
<div id="net" class="hidden">⚠️ Mất kết nối máy chủ — đang tự động kết nối lại...</div>

<script type="module" src="/hub.js"></script>
<script type="module" src="/xmas.js"></script>
</body>
</html>
